<section class="alunos-layout-corpo">
    <div class="header">
        <div class="fundo-input">
            <div class="icone-pesquisa">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-search"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M21 21l-6 -6" /></svg>
            </div>
            <input type="text" class="pesquisa-input" placeholder="Pesquise pelo dados do aluno...">
        </div>

        <button class="alunos-em-risco" [class.ativo]="alunosEmRisco()" (click)="alternarAlunosEmRisco()">Alunos em risco</button>
    </div>

    <div class="alunos" [class.esta-carregando-nao-tem]="carregandoComponente() || alunos().length === 0">
        @if (carregandoComponente()) {
            <app-carregamento></app-carregamento>
        }
        @else if (alunos().length > 0) {
            @for (aluno of alunos(); track aluno.matriculaId) {
                <app-unidade-aluno
                    [aluno]="aluno"
                    (click)="mostrarPopup(aluno)"
                ></app-unidade-aluno>
            }
        }
        @else {
            <p class="nao-tem">Não tem Alunos</p>
        }
        
    </div>
</section>
