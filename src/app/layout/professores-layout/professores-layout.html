<section class="professores-layout-corpo">
    <div class="header">
        <div class="fundo-input">
            <div class="icone-pesquisa">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-search"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M21 21l-6 -6" /></svg>
            </div>
            <input type="text" class="pesquisa-input" placeholder="Pesquise pelo dados do professor...">
        </div>
        <div class="icone-filtro">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-filter-2"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M4 6h16" /><path d="M6 12h12" /><path d="M9 18h6" /></svg>
        </div>
    </div>

    <div class="professores" [class.esta-carregando-nao-tem]="carregandoComponente || professores().length === 0">
        @if(carregandoComponente){
            <app-carregamento></app-carregamento>
        }

        @else if(!carregandoComponente && professores().length > 0){
            @for (professor of professores(); track professor.id) {
                <app-unidade-professor
                [professor]="professor"
                (click)="mostrarPopup(professor)"
                ></app-unidade-professor>
            }
        }

        @else{
            <p class="nao-tem">Não tem Professores</p>
        }
        
    </div>
</section>
