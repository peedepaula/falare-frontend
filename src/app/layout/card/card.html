<section class="card-corpo" [class.com-botao]="botaoAtivo()">
    <p class="titlo-card">{{ nomeCampo() }}:</p>
    @if(!botaoAtivo()){
        <h4 class="card-dado">{{ dadoCampo() }}</h4>
    }
    @if(botaoAtivo()){
        <button class="botao-card" (click)="mostrarPopup()">Consultar</button>
    }
</section>
