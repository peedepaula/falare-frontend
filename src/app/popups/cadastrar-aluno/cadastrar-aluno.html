<section class="pop-up-corpo">
    <header class="header-popup">
        <h5 class="titulo-popup">{{ editando ? 'Editar aluno' : 'Cadastrar aluno' }}</h5>
        <button class="icone-x" (click)="fecharPopup()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-x"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M18 6l-12 12" /><path d="M6 6l12 12" /></svg>
        </button>
    </header>

    <form [formGroup]="form" (ngSubmit)="salvar()">
        <div class="conteudo-popup">
            <div class="fundo-input">
                <p class="nome-input">Nome:</p>
                <input type="text" class="input-nota" formControlName="nome" placeholder="EX: Pedro de Paula">
            </div>
            <div class="fundo-input">
                <p class="nome-input">E-mail:</p>
                <input type="text" class="input-nota" formControlName="email" placeholder="EX: seu@gmail.com">
            </div>
            <div class="fundo-input">
                <p class="nome-input">Senha:</p>
                <input type="password" class="input-nota" formControlName="senha"
                    [placeholder]="editando ? 'Deixe em branco para manter a atual' : 'Mínimo 6 caracteres'">
            </div>
            <div class="fundo-input">
                <p class="nome-input">Telefone:</p>
                <input type="text" class="input-nota" formControlName="telefone" placeholder="EX: (11) 98888-8888">
            </div>
        </div>

        <button class="salvar" type="submit" [disabled]="form.invalid || salvando">
            {{ salvando ? 'Salvando...' : (editando ? 'Atualizar' : 'Salvar') }}
        </button>
    </form>

</section>
