<section class="pop-up-corpo">
    <header class="header-popup">
        <h5 class="titulo-popup">Chamada</h5>
        <button class="icone-x" (click)="fecharPopup()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-x"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M18 6l-12 12" /><path d="M6 6l12 12" /></svg>
        </button>
    </header>

    <div class="conteudo-popup">
        <header class="explicacao">
            <p class="dados-indice">Aluno</p>
            <p class="dados-indice">Presença</p>
        </header>
        <div class="lista-alunos">
            @if(alunos().length > 0){
                @for (aluno of alunos(); track aluno.matriculaId) {
                    <div class="aluno">
                        <div class="nome-foto">
                            <div class="foto">
                                <div class="icon-usuario">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-user"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" /><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" /></svg>
                                </div>
                            </div>
                            <div class="nome-atestado">
                                <h4 class="nome">{{ aluno.nome }}</h4>
                                @if (!estaPresente(aluno.matriculaId)) {
                                    <label class="presenca-atestado">
                                        <input type="checkbox"
                                            [disabled]="jaTemChamada()"
                                            [checked]="atestados()[aluno.matriculaId] ?? false"
                                            (change)="alternarAtestado(aluno.matriculaId, $any($event.target).checked)">
                                        Atestado
                                    </label>
                                }
                            </div>
                        </div>
        

                        <input type="checkbox" class="presenca"
                            [disabled]="jaTemChamada()"
                            [checked]="estaPresente(aluno.matriculaId)"
                            (change)="alternarPresenca(aluno.matriculaId, $any($event.target).checked)">
                    </div>
                }
            }
            @else {
                <p class="nao-tem">Não tem Alunos</p>
            }
        </div>

        @if(!jaTemChamada()){
        <button class="salvar"
            [disabled]="salvando() || carregando() || jaTemChamada()"
            (click)="salvarChamada()">Salvar</button>
        }
    </div>

</section>
