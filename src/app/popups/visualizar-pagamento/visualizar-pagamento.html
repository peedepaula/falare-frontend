<section class="pop-up-corpo">
    <header class="header-popup">
        <h5 class="titulo-popup">Pagamento</h5>
        <button class="icone-x" (click)="fecharPopup()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-x"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M18 6l-12 12" /><path d="M6 6l12 12" /></svg>
        </button>
    </header>

    <div class="conteudo-popup" [class.esta-carregando-nao-tem]="carregandoComponente">
        @if (pagamento(); as p){
            <section class="sessao-dados-alunos">
                <div class="img-aluno">
                    <div class="icon-usuario">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-user"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" /><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" /></svg>
                    </div>
                </div>
    
                <div class="dados-aluno">
                    <h3 class="nome-aluno">
                        <div class="icone-do-input">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-user"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" /><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" /></svg>
                        </div>
                        {{ p.alunoNome}}
                    </h3>
    
                    <div class="nome">
                        <div class="icone-do-input">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-mail-opened"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 9l9 6l9 -6l-9 -6l-9 6" /><path d="M21 9v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-10" /><path d="M3 19l6 -6" /><path d="M15 13l6 6" /></svg>
                        </div>
                        E-mail:
                        <span class="dado">
                            {{ p.email }}
                        </span>
                    </div>
                    <div class="nome">
                        <div class="icone-do-input">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-phone"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M5 4h4l2 5l-2.5 1.5a11 11 0 0 0 5 5l1.5 -2.5l5 2v4a2 2 0 0 1 -2 2a16 16 0 0 1 -15 -15a2 2 0 0 1 2 -2" /></svg>
                        </div>
                        Telefone:
                        <span class="dado">
                            {{ p.telefone }}
                        </span>
                    </div>
                    <div class="nome">
                        <div class="icone-do-input">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-language"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M9 6.371c0 4.418 -2.239 6.629 -5 6.629" /><path d="M4 6.371h7" /><path d="M5 9c0 2.144 2.252 3.908 6 4" /><path d="M12 20l4 -9l4 9" /><path d="M19.1 18h-6.2" /><path d="M6.694 3l.793 .582" /></svg>
                        </div>
                        Curso:
                        <span class="dado">
                            {{ p.idioma }}
                        </span>
                    </div>
                    <div class="nome">
                        <div class="icone-do-input">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-align-left-2"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M4 4v16" /><path d="M8 6h12" /><path d="M8 12h6" /><path d="M8 18h10" /></svg>
                        </div>
                        Nível:
                        <span class="dado">
                            {{ p.nivel }}
                        </span>
                    </div>
                </div>
            </section>
    
            <section class="sessao-pagamentos">
                <div class="nome-dado">
                    <h5 class="nome">Valor:</h5>
                    <p class="dado">R$: {{ p.valor }}</p>
                </div>
                <div class="nome-dado">
                    <h5 class="nome">Status:</h5>
                    <p class="dado"> {{ p.status }} </p>
                </div>
                <div class="nome-dado">
                    <h5 class="nome">CriadoEm:</h5>
                    <p class="dado"> {{ formatarData(p.criadoEm) }} </p>
                </div>
            </section>
        }

        @else{
            <app-carregamento></app-carregamento>
        }
    </div>
    <div class="botoes-footer">
        <button class="salvar apagar" (click)="deletarPagamento()">Apagar</button>
        <button class="salvar" (click)="passarPagamento()">Editar</button>
    </div>

</section>
