<section class="pop-up-corpo">
    <header class="header-popup">
        <h5 class="titulo-popup">Atualizar Mátricula</h5>
        <button class="icone-x" (click)="fecharPopup()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-x"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M18 6l-12 12" /><path d="M6 6l12 12" /></svg>
        </button>
    </header>

    <div class="conteudo-popup">
        <div class="dados-cadastro">
            <div class="fundo-input">
                <p class="nome-input">P1:</p>
                <div class="fundo-input-real">
                    <div class="icone-do-input">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-school"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M22 9l-10 -4l-10 4l10 4l10 -4v6" /><path d="M6 10.6v5.4a6 3 0 0 0 12 0v-5.4" /></svg>
                    </div>
                    <input type="text" class="input-nota" placeholder="EX: 10.00" [(ngModel)]="form.p1">
                </div>
            </div>

            <div class="fundo-input">
                <p class="nome-input">P2:</p>
                <div class="fundo-input-real">
                    <div class="icone-do-input">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-school"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M22 9l-10 -4l-10 4l10 4l10 -4v6" /><path d="M6 10.6v5.4a6 3 0 0 0 12 0v-5.4" /></svg>
                    </div>
                    <input type="text" class="input-nota" placeholder="EX: 10.00" [(ngModel)]="form.p2">
                </div>
            </div>

            <div class="fundo-input">
                <p class="nome-input">Trabalho:</p>
                <div class="fundo-input-real">
                    <div class="icone-do-input">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-school"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M22 9l-10 -4l-10 4l10 4l10 -4v6" /><path d="M6 10.6v5.4a6 3 0 0 0 12 0v-5.4" /></svg>
                    </div>
                    <input type="text" class="input-nota" placeholder="EX: 10.00" [(ngModel)]="form.trabalho">
                </div>
            </div>

            <div class="fundo-input">
                <p class="nome-input">Status:</p>
                <div class="fundo-input-real">
                    <div class="icone-do-input">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-progress-alert"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M10 20.777a8.942 8.942 0 0 1 -2.48 -.969" /><path d="M14 3.223a9.003 9.003 0 0 1 0 17.554" /><path d="M4.579 17.093a8.961 8.961 0 0 1 -1.227 -2.592" /><path d="M3.124 10.5c.16 -.95 .468 -1.85 .9 -2.675l.169 -.305" /><path d="M6.907 4.579a8.954 8.954 0 0 1 3.093 -1.356" /><path d="M12 8v4" /><path d="M12 16v.01" /></svg>
                    </div>
                    <input type="text" class="input-nota" placeholder="EX: ativa" disabled [value]="form.status ?? ''">
                    <button class="icon-seta" (click)="mostrarStatus=!mostrarStatus">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-down"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M6 9l6 6l6 -6" /></svg>
                    </button>
                    @if (mostrarStatus) {
                        <div class="fundo-conteudo-aberto">
                            @for (s of statusOpcoes; track s; let last = $last) {
                                <p class="opcao" [class.sem-border]="last" (click)="selecionarStatus(s)">{{ s }}</p>
                            }
                        </div>
                    }
                </div>
            </div>
        </div>
    </div>

    <div class="botoes-footer">
        <button class="salvar apagar" (click)="deletarMatricula()" [disabled]="travarBotao">Apagar</button>
        <button class="salvar" (click)="atualizarMatricula()" [disabled]="travarBotao">Salvar</button>
    </div>

</section>
