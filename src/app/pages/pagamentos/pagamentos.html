<main class="modelo-corpo-painel">
    <app-header class="header"></app-header>
    <app-nav class="nav"></app-nav>
    <section class="conteudo">
        <section class="cards">
            <app-card
            nomeCampo="Total pago"
            dadoCampo="R$: 10.000"
            >
            </app-card>
            <app-card
            nomeCampo="Total pendente"
            dadoCampo="R$: 10.000"
            >
            </app-card>
            <app-card
            nomeCampo="Total atrasado"
            dadoCampo="R$: 10.000"
            >
            </app-card>
        </section>
        
        <app-pagamentos-layout (mostrar)="trocarVisualizarPagamento()"></app-pagamentos-layout>

        <app-botao-criar textoBotao="Cadastrar novo Pagamento" (click)="mostrarCadastrarPagamento=true"></app-botao-criar>
    </section>

    @if(mostrarVisualizarPagamento){
        <section class="pop-up">
            <app-visualizar-pagamento (fechar)="trocarVisualizarPagamento()"></app-visualizar-pagamento>
        </section>
    }

    @if(mostrarCadastrarPagamento){
        <section class="pop-up">
            <app-cadastrar-pagamento (fechar)="mostrarCadastrarPagamento=false"></app-cadastrar-pagamento>
        </section>
    }
</main>
