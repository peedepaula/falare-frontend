<main class="modelo-corpo-painel">
    <app-header class="header" (mostrarMenuMobileEmit)="trocarManuMobile($event)"></app-header>
    <app-nav class="nav"></app-nav>
    @if(mostrarMenu){
        <div class="fundo-nav-mobile">
            <app-nav class="nav-mobile"></app-nav>
        </div>
    }
    <section class="conteudo">
        <section class="cards">
            <app-card
            nomeCampo="Total pago"
            [dadoCampo]="analyticsDados()?.totalPago ?? 0"
            >
            </app-card>
            <app-card
            nomeCampo="Total pendente"
            [dadoCampo]="analyticsDados()?.totalPendente ?? 0"
            >
            </app-card>
            <app-card
            nomeCampo="Total atrasado"
            [dadoCampo]="analyticsDados()?.totalAtrasado ?? 0"
            >
            </app-card>
        </section>
        
        <app-pagamentos-layout
        (mostrar)="visualizarPagamento($event)">
        </app-pagamentos-layout>

        <app-botao-criar textoBotao="Cadastrar novo Pagamento" (click)="mostrarCadastrarPagamento=true"></app-botao-criar>
    </section>

    @if(mostrarVisualizarPagamento){
        <section class="pop-up">
            <app-visualizar-pagamento
            (recarregarPagamentos)="recarregarPagamentos()"
            (fechar)="fecharVisualizarPagamento()"
            [pagamentoSelecionado]="pagamentoSelecionado"
            (mostrarEditarPagamento)="mostrarCadastrarPagamento=true">
            </app-visualizar-pagamento>
        </section>
    }

    @if(mostrarCadastrarPagamento){
        <section class="pop-up">
            <app-cadastrar-pagamento
            (recarregarPagamentos)="recarregarPagamentos()"
            [pagamentoSelecionado]="pagamentoSelecionado"
            (fechar)="mostrarCadastrarPagamento=false">
            </app-cadastrar-pagamento>
        </section>
    }
</main>
