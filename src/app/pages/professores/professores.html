<main class="modelo-corpo-painel">
    <app-header class="header"></app-header>
    <app-nav class="nav"></app-nav>
    <section class="conteudo">
        <section class="cards">
            <app-card
            nomeCampo="Total professores"
            dadoCampo="75"
            >
            </app-card>
            <app-card
            nomeCampo="Professores inativo"
            dadoCampo="16"
            >
            </app-card>
            <app-card
            nomeCampo="Professores apagados"
            dadoCampo="32"
            >
            </app-card>
        </section>
        
        <app-professores-layout (mostrar)="trocarVisualizarCadastrarProfessor()"></app-professores-layout>

        <app-botao-criar textoBotao="Cadastrar novo Professor" (click)="trocarVisualizarCadastrarProfessor()"></app-botao-criar>
    </section>

    @if(mostrarVisualizarCadastrarProfessor){
        <section class="pop-up">
            <app-cadastrar-professor (fechar)="trocarVisualizarCadastrarProfessor()"></app-cadastrar-professor>
        </section>
    }
</main>
