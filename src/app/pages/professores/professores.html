<main class="modelo-corpo-painel">
    <app-header class="header" (mostrarMenuMobileEmit)="trocarManuMobile($event)"></app-header>
    <app-nav class="nav"></app-nav>
    @if(mostrarMenu){
        <div class="fundo-nav-mobile">
            <app-nav class="nav-mobile"></app-nav>
        </div>
    }
    <section class="conteudo">
        <section class="cards">
            <app-card
            nomeCampo="Total professores"
            [dadoCampo]="75"
            >
            </app-card>
            <app-card
            nomeCampo="Professores inativo"
            [dadoCampo]="16"
            >
            </app-card>
            <app-card
            nomeCampo="Professores apagados"
            [dadoCampo]="32"
            >
            </app-card>
        </section>
        
        <app-professores-layout (mostrar)="abrirEdicao($event)"></app-professores-layout>

        <app-botao-criar textoBotao="Cadastrar novo Professor" (click)="abrirCadastro()"></app-botao-criar>
    </section>

    @if(mostrarPopup){
        <section class="pop-up">
            <app-cadastrar-professor
            [professor]="professorSelecionado"
            (salvou)="recarregarProfessores()"
            (fechar)="fecharPopup()">
            </app-cadastrar-professor>
        </section>
    }
</main>
