<main class="modelo-corpo-painel">
    <app-header class="header" (mostrarMenuMobileEmit)="trocarManuMobile($event)"></app-header>
    <app-nav class="nav"></app-nav>
    @if(mostrarMenu){
        <div class="fundo-nav-mobile">
            <app-nav class="nav-mobile"></app-nav>
        </div>
    }
    <section class="conteudo">
        <section class="cards">
            <app-card
            nomeCampo="Total de Aulas"
            [dadoCampo]="analyticsDados()?.totalAulas ?? 0"
            >
            </app-card>
            <app-card
            nomeCampo="Média de notas"
            [dadoCampo]="analyticsDados()?.mediaNotas ?? 0"
            >
            </app-card>
            <app-card
            nomeCampo="Média de faltas"
            [dadoCampo]="analyticsDados()?.mediaFaltasPorAula ?? 0"
            >
            </app-card>
        </section>
        
        <app-aulas-layout
        (mostrar)="abrirVisualizarAula($event)">
        </app-aulas-layout>

        <app-botao-criar textoBotao="Cadastrar nova Aula" (click)="mostrarCadastrarAula=true"></app-botao-criar>

    </section>

    @if (mostrarVisualizarAula) {
        <section class="pop-up">
            <app-visualizar-aula 
            [aula]="aulaSelecionada"
            (aulaDeletada)="recarregarAulas()"
            (fechar)="fecharVisualizarAula()">
            </app-visualizar-aula>
        </section>
    }
    @if (mostrarCadastrarAula) {
        <section class="pop-up">
            <app-cadastrar-aula
            (aulaCriada)="recarregarAulas()"
            (fechar)="mostrarCadastrarAula=false">
            </app-cadastrar-aula>
        </section>
    }
</main>
