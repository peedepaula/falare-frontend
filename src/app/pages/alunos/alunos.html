<main class="modelo-corpo-painel">
    <app-header class="header" (mostrarMenuMobileEmit)="trocarManuMobile($event)"></app-header>
    <app-nav class="nav"></app-nav>
    @if(mostrarMenu){
        <div class="fundo-nav-mobile">
            <app-nav class="nav-mobile"></app-nav>
        </div>
    }
    <section class="conteudo">
        <section class="cards">
            <app-card
            nomeCampo="Total de Alunos"
            [dadoCampo]="analyticsDados()?.totalAlunos ?? 0"
            >
            </app-card>
            <app-card
            nomeCampo="Média de notas"
            [dadoCampo]="analyticsDados()?.mediaNotas ?? 0"
            >
            </app-card>
            <app-card
            nomeCampo="Média de faltas"
            [dadoCampo]="analyticsDados()?.mediaFaltas ?? 0"
            >
            </app-card>
        </section>
        
        <app-alunos-layout (mostrar)="abrirVisualizar($event)"></app-alunos-layout>
        @if(podeVer){
            <app-botao-criar textoBotao="Cadastrar novo Aluno" (click)="abrirCadastro()"></app-botao-criar>
        }
    </section>

    @if (mostrarVisualizarAluno) {
        <section class="pop-up">
            <app-visualizar-aluno
                [alunoSelecionado]="alunoSelecionado"
                (fechar)="fecharVisualizar()"
                (editar)="abrirEdicao()"
                (apagar)="abrirApagar()"
                (recarregarAlunos)="recarregarAlunos()">
            </app-visualizar-aluno>
        </section>
    }
    @if (mostrarCadastrarAluno) {
        <section class="pop-up">
            <app-cadastrar-aluno
            [aluno]="alunoSelecionado"
            (fechar)="mostrarCadastrarAluno=false"
            (salvo)="aoSalvar()">
            </app-cadastrar-aluno>
        </section>
    }
    @if (mostrarApagarAluno) {
        <section class="pop-up">
            <app-global-confirmacao
                [titulo]="'Apagar Aluno'"
                [descricao]="'Deseja realmente apagar o Aluno, ao apagar não é possivel realizar a recuperação.'"
                [tipo]="'apagar'"

                (fechar)="fecharApagar()"
                (confirmado)="apagarUsuario()"
            >
            </app-global-confirmacao>
        </section>
    }
</main>
