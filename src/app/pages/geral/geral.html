<main class="modelo-corpo-painel">
    <app-header class="header"></app-header>
    <app-nav class="nav"></app-nav>
    <section class="conteudo">
        <section class="cards">
            <app-card 
            nomeCampo="Total de Aulas"
            dadoCampo="30"
            ></app-card>
            <app-card
            nomeCampo="Total de Alunos"
            dadoCampo="200"
            ></app-card>
            <app-card
            nomeCampo="Total de Turmas"
            dadoCampo="9"
            ></app-card>
        </section>
        
        <app-melhores-alunos class="melhores" (mostrar)="trocarVisualizarAluno()"></app-melhores-alunos>
        <app-piores-alunos class="piores" (mostrar)="trocarVisualizarAluno()"></app-piores-alunos>
    </section>

    @if(mostrarVisualizarAluno){
        <section class="pop-up">
            <app-visualizar-aluno (fechar)="trocarVisualizarAluno()"></app-visualizar-aluno>
        </section>
    }
</main>
