<main class="modelo-corpo-painel">
    <app-header class="header" (mostrarMenuMobileEmit)="trocarManuMobile($event)"></app-header>
    <app-nav class="nav"></app-nav>
    @if(mostrarMenu){
        <div class="fundo-nav-mobile">
            <app-nav class="nav-mobile"></app-nav>
        </div>
    }
    <section class="conteudo">
        <section class="cards">
            <app-card 
            nomeCampo="Total de Aulas"
            [dadoCampo]="analyticsDados()?.totalAulas ?? 0"
            ></app-card>
            <app-card
            nomeCampo="Total de Alunos"
            [dadoCampo]="analyticsDados()?.totalAlunos ?? 0"
            ></app-card>
            <app-card
            nomeCampo="Total de Turmas"
            [dadoCampo]="analyticsDados()?.totalTurmas ?? 0"
            ></app-card>
        </section>

        <div class="area-texto-main">
            <div class="textos">
                <h3 class="texto-principal">Olá, {{ usuario()?.nome }}! Seja muito bem-vindo.</h3>
                <p class="texto-secundario">Use os atalhos abaixo para acessar rapidamente os principais módulos de gestão da escola.</p>
            </div>

            <div class="grid-botoes">
                <button class="botao-do-grid" routerLink="/aulas">
                    <div class="botao-grid-icone">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-chalkboard-teacher"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M8 19h-3a2 2 0 0 1 -2 -2v-10a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v11a1 1 0 0 1 -1 1" /><path d="M12 14a2 2 0 1 0 4.001 -.001a2 2 0 0 0 -4.001 .001" /><path d="M17 19a2 2 0 0 0 -2 -2h-2a2 2 0 0 0 -2 2" /></svg>
                    </div>
                    Aulas
                </button>
                <button class="botao-do-grid" routerLink="/alunos">
                    <div class="botao-grid-icone">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-school"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M22 9l-10 -4l-10 4l10 4l10 -4v6" /><path d="M6 10.6v5.4a6 3 0 0 0 12 0v-5.4" /></svg>
                    </div>
                    Alunos
                </button>
                <button class="botao-do-grid" routerLink="/turmas">
                    <div class="botao-grid-icone">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-tournament"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M2 4a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M18 10a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M2 12a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M2 20a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M6 12h3a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-3" /><path d="M6 4h7a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-2" /><path d="M14 10h4" /></svg>
                    </div>
                    Turmas
                </button>
                @if(tipoUsuario === "Secretaria"){
                    <button class="botao-do-grid" routerLink="/pagamentos">
                        <div class="botao-grid-icone">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-cash-banknote-move-back"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /><path d="M12 18h-7a2 2 0 0 1 -2 -2v-8a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v4.5" /><path d="M18 12h.01" /><path d="M6 12h.01" /><path d="M16 19h6" /><path d="M19 16l-3 3l3 3" /></svg>
                        </div>
                        Pagamentos
                    </button>
                    <button class="botao-do-grid" routerLink="/matriculas">
                        <div class="botao-grid-icone">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-address-book"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M20 6v12a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2" /><path d="M10 16h6" /><path d="M11 11a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M4 8h3" /><path d="M4 12h3" /><path d="M4 16h3" /></svg>
                        </div>
                        Matrícula
                    </button>
                    <button class="botao-do-grid" routerLink="/professores">
                        <div class="botao-grid-icone">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-users-group"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M10 13a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M8 21v-1a2 2 0 0 1 2 -2h4a2 2 0 0 1 2 2v1" /><path d="M15 5a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M17 10h2a2 2 0 0 1 2 2v1" /><path d="M5 5a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M3 13v-1a2 2 0 0 1 2 -2h2" /></svg>
                        </div>
                        Professores
                    </button>
                }
            </div>
        </div>
    </section>
</main>
