<main class="modelo-corpo-painel">
    <app-header class="header" (mostrarMenuMobileEmit)="trocarManuMobile($event)"></app-header>
    <app-nav class="nav"></app-nav>
    @if(mostrarMenu){
        <div class="fundo-nav-mobile">
            <app-nav class="nav-mobile"></app-nav>
        </div>
    }
    <section class="conteudo">
        <section class="cards">
            <app-card
            nomeCampo="Total de turmas"
            [dadoCampo]="analyticsDados()?.totalTurmas ?? 0"
            >
            </app-card>
            <app-card
            nomeCampo="Média de alunos"
            [dadoCampo]="analyticsDados()?.mediaAlunos ?? 0"
            >
            </app-card>
            <app-card
            nomeCampo="Média de faltas"
            [dadoCampo]="analyticsDados()?.mediaFaltas ?? 0"
            >
            </app-card>
        </section>
        
        <app-turmas-layout (mostrar)="visualizarTurma($event)"></app-turmas-layout>

        @if(podeVer){
            <app-botao-criar textoBotao="Cadastrar nova Turma" (click)="mostrarCadastrarTurma=true"></app-botao-criar>
        }
    </section>

    @if (mostrarVisualizarTurma) {
        <section class="pop-up">
            <app-visualizar-turma
            [turmaSelecionada]="turmaSelecionada"
            (recarregarTurmas)="recarregarTurmas()"
            (editarTurma)="mostrarCadastrarTurma=true"
            (fechar)="fecharTurma()">
            </app-visualizar-turma>
        </section>
    }

    @if (mostrarCadastrarTurma) {
        <section class="pop-up">
            <app-cadastrar-turma
            [turmaSelecionada]="turmaSelecionada"
            (recarregarTurmas)="recarregarTurmas()"
            (fechar)="fecharEditarCadastrarTurma()">
            </app-cadastrar-turma>
        </section>
    }
</main>
