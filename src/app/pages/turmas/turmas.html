<main class="modelo-corpo-painel">
    <app-header class="header"></app-header>
    <app-nav class="nav"></app-nav>
    <section class="conteudo">
        <section class="cards">
            <app-card
            nomeCampo="Total de turmas"
            dadoCampo="30"
            >
            </app-card>
            <app-card
            nomeCampo="Média de alunos"
            dadoCampo="7.9"
            >
            </app-card>
            <app-card
            nomeCampo="Média de faltas"
            dadoCampo="3.1"
            >
            </app-card>
        </section>
        
        <app-turmas-layout (mostrar)="mostrarVisualizarTurma=true"></app-turmas-layout>

        <app-botao-criar textoBotao="Cadastrar nova Turma" (click)="mostrarCadastrarTurma=true"></app-botao-criar>
    </section>

    @if (mostrarVisualizarTurma) {
        <section class="pop-up">
            <app-visualizar-turma (fechar)="trocarVisualizarTurma()"></app-visualizar-turma>
        </section>
    }

    @if (mostrarCadastrarTurma) {
        <section class="pop-up">
            <app-cadastrar-turma (fechar)="mostrarCadastrarTurma=false"></app-cadastrar-turma>
        </section>
    }
</main>
