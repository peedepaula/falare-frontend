<main class="modelo-corpo-painel">
    <app-header class="header" (mostrarMenuMobileEmit)="trocarManuMobile($event)"></app-header>
    <app-nav class="nav"></app-nav>
    @if(mostrarMenu){
        <div class="fundo-nav-mobile">
            <app-nav class="nav-mobile"></app-nav>
        </div>
    }
    <section class="conteudo">
        <section class="cards">
            <app-card
            nomeCampo="Total de matriculas"
            dadoCampo="280"
            >
            </app-card>
            <app-card
            nomeCampo="Matrículas inativas"
            dadoCampo="80"
            >
            </app-card>
            <app-card
            nomeCampo="Criadas este mês"
            dadoCampo="10"
            >
            </app-card>
        </section>
        
        <app-matriculas-layout (mostrar)="mostrarEditarMatricula($event)"></app-matriculas-layout>

        <app-botao-criar textoBotao="Cadastrar nova Matrícula" (click)="mostrarCadastrarMatricula=true"></app-botao-criar>
    </section>

    @if(mostrarCadastrarMatricula){
        <section class="pop-up">
            <app-cadastrar-matricula
            (matriculaCadastrada)="recarregarMatriculas()"
            (fechar)="mostrarCadastrarMatricula=false">
            </app-cadastrar-matricula>
        </section>
    }

    @if(mostrarAtualizarMatricula){
        <section class="pop-up">
            <app-atualizar-matricula
            [matricula]="matriculaSelecionada"
            (matriculaAtualizada)="recarregarMatriculas()"
            (fechar)="fecharEditarMatricula()">
            </app-atualizar-matricula>
        </section>
    }
</main>
